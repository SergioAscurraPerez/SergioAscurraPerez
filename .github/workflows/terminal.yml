name: Terminal SRGO

on:
  schedule:
    - cron: "17 3 * * *"      # todos los dias, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render.py", ".github/workflows/terminal.yml"]

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Renderizar SVG con la actividad real
        env:
          # GH_PAT (scope read:user) incluye contribuciones privadas; sin el, solo las publicas.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/render.py --login "${{ github.repository_owner }}" --out assets

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "terminal: actualizar graficos $(date -u +%F)"
            git push
          fi
