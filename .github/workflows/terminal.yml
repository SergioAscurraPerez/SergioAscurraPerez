name: Terminal SRGO

on:
  schedule:
    - cron: "17 3 * * *"      # todos los dias, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render.py", ".github/workflows/terminal.yml"]

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hace falta un token personal (secreto GH_PAT, scopes read:user y repo) para que
      # la API devuelva tambien las contribuciones y repos privados. Con el token por
      # defecto solo se ve lo publico y los graficos saldrian incompletos, asi que en
      # ese caso no se toca nada.
      - name: Renderizar SVG con la actividad real
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}   # variable de repositorio, opcional
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::Falta el secreto GH_PAT; se conservan los graficos actuales."
            exit 0
          fi
          python scripts/render.py --login "${{ github.repository_owner }}" --out assets

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "terminal: actualizar graficos $(date -u +%F)"
            git push
          fi
